<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300"
     role="img" aria-label="CloudBar">
  <defs>
    <linearGradient id="cb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23272b"/>
      <stop offset="1" stop-color="#14171a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="70" fill="url(#cb-bg)"/>
