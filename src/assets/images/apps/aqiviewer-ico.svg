<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="AQI Viewer icon">
  <defs>
    <linearGradient id="aqiSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2340"/>
      <stop offset="55%" stop-color="#241f33"/>
      <stop offset="100%" stop-color="#1d1d1d"/>
    </linearGradient>
  </defs>

  <rect width="150" height="150" rx="28" fill="url(#aqiSky)"/>

  <!-- haze bands -->
  <g opacity="0.28" stroke="#fcb045" stroke-linecap="round" stroke-width="3">
    <line x1="24" y1="118" x2="70" y2="118"/>
    <line x1="80" y1="118" x2="126" y2="118"/>
    <line x1="38" y1="128" x2="112" y2="128"/>
  </g>

  <!-- gauge track segments: good -> hazardous -->
  <g fill="none" stroke-width="11" stroke-linecap="butt">
    <path d="M29,88 A46,46 0 0 1 42.47,55.47" stroke="#32efa6"/>
    <path d="M42.47,55.47 A46,46 0 0 1 75,42" stroke="#f4fd5b"/>
    <path d="M75,42 A46,46 0 0 1 107.53,55.47" stroke="#fcb045"/>
    <path d="M107.53,55.47 A46,46 0 0 1 121,88" stroke="#e63e3e"/>
  </g>

  <!-- needle -->
  <line x1="75" y1="88" x2="63.4" y2="56" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="75" cy="88" r="6.5" fill="#ffffff"/>
  <circle cx="75" cy="88" r="2.6" fill="#241f33"/>

  <text x="75" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#00e6ff" letter-spacing="1.5">AQI</text>
</svg>
