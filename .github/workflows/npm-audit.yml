# npm audit
#
# Private-repo-friendly dependency vulnerability scan. Unlike GitHub's
# Dependency Review, `npm audit` works on private repos without GitHub
# Advanced Security. It reads package-lock.json and checks it against the
# npm advisory database (no full install required).
#
# NOTE: This step is currently informational (continue-on-error) because this
# Create React App project ships build-time tooling (webpack, etc.) as
# production dependencies, which npm audit flags even though they aren't
# exploitable at runtime. After a dependency / CRA modernization, drop the
# continue-on-error to turn this into a hard gate.
name: 'npm audit'

on:
  pull_request:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '38 18 * * 2'

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit (high+ severity)
        continue-on-error: true
        run: npm audit --audit-level=high
