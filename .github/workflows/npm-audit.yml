# npm audit
#
# Private-repo-friendly dependency vulnerability scan. Unlike GitHub's
# Dependency Review, `npm audit` works on private repos without GitHub
# Advanced Security. It reads package-lock.json and checks it against the
# npm advisory database (no full install required).
#
# This is a BLOCKING gate. It was informational while the Next 14 pin carried
# unfixable postcss/sharp advisories; #95 (Next 16 + React 19) cleared them, so
# `npm audit --audit-level=high` now reports 0 and a regression should fail the
# build rather than be quietly tolerated.
name: 'npm audit'

on:
  pull_request:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '38 18 * * 2'

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run npm audit (high+ severity)
        run: npm audit --audit-level=high
