# npm audit
#
# Private-repo-friendly dependency vulnerability scan. Unlike GitHub's
# Dependency Review, `npm audit` works on private repos without GitHub
# Advanced Security. It reads package-lock.json and checks it against the
# npm advisory database (no full install required).
#
# NOTE: This step is currently informational (continue-on-error) because the
# Next.js 14 pin carries upstream advisories that only affect self-hosting
# features this site doesn't use (image optimizer remote patterns, rewrites).
# After the Next 15/16 + React 19 bump (#80), drop the continue-on-error to
# turn this into a hard gate.
name: 'npm audit'

on:
  pull_request:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '38 18 * * 2'

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run npm audit (high+ severity)
        continue-on-error: true
        run: npm audit --audit-level=high
