# Lighthouse (post-deploy)
#
# Post-merge value: after a merge to main, the Deploy workflow publishes
# timknab.dev to Firebase Hosting; this workflow then audits the LIVE site for performance, accessibility,
# best practices, and SEO — the numbers that actually matter for a portfolio.
#
# Reports are uploaded as run artifacts and to Lighthouse CI's temporary
# public storage (a shareable report link appears in the run output). The
# audit is informational, not blocking: scores fluctuate with network noise,
# and a red X on main for a 2-point dip would be alarm fatigue. Watch trends
# in the run history instead.
name: Lighthouse

on:
  # Runs once the deploy has finished, so it audits what was just published.
  workflow_run:
    workflows: [ "Deploy" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # Monthly drift check even when nothing merges (covers dependency-less
    # regressions: expired headers, hosting config drift, font/CDN changes).
    - cron: '15 9 3 * *'

permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit live site
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://timknab.dev
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
